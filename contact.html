<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Grishma Saru Magar</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <a class="skip" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="wrap bar">
        <a class="brand" href="index.html">Grishma Saru Magar</a>
        <nav aria-label="Main">
          <ul>
            <li><a href="index.html">About</a></li>
            <li><a href="interests.html">Interests</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap">
      <h1>Contact me</h1>
      <p>Send me a message using the form. All fields are required.</p>

      <form id="contact-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            aria-describedby="name-err"
            required
          />
          <p class="error" id="name-err"></p>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            aria-describedby="email-err"
            required
          />
          <p class="error" id="email-err"></p>
        </div>
        <div class="field">
          <label for="message">Comments or questions</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            aria-describedby="message-err"
            required
          ></textarea>
          <p class="error" id="message-err"></p>
        </div>
        <button type="submit">Send message</button>
      </form>
      <p id="status" role="status"></p>
    </main>

    <footer class="wrap">
      <p>&copy; 2026 Grishma Saru Magar</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
